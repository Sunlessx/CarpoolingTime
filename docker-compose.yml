# docker compose up  ->  http://localhost:8080
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: blablacar
      DB_USER: blablacar
      DB_PASSWORD: blablacar
    volumes:
      - ./:/var/www/html  # les modifs du code sont visibles sans rebuild
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blablacar
      MYSQL_USER: blablacar
      MYSQL_PASSWORD: blablacar
    volumes:
      # importé automatiquement au premier démarrage
      - ./blablacar2026.sql:/docker-entrypoint-initdb.d/blablacar2026.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
